[project]
name = "scraper-poc-backend"
version = "0.1.0"
description = "Crawling POC: FastAPI + ARQ + Scrapy"
requires-python = ">=3.11"
dependencies = [
    "arq>=0.26",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pymongo>=4.18.1",
    "redis>=5.0",
    "scrapy>=2.12",
    "scrapy-playwright>=0.0.42",
    "trafilatura>=1.12",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.uv]
package = false
